<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8b4bc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WishList">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ma WishList</title>
<style>
:root{--bg:#fbeef0;--card:#fff;--rose:#e8b4bc;--rose-d:#c98791;--txt:#4a3438;--mut:#9b7f84;--line:#f3d9dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--rose);padding:calc(env(safe-area-inset-top) + 18px) 18px 22px;border-radius:0 0 28px 28px;color:#fff;text-align:center}
h1{margin:0;font-size:1.5rem}
.sub{opacity:.9;font-size:.85rem;margin-top:4px}
main{max-width:560px;margin:0 auto;padding:16px}
.add{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(201,135,145,.15);display:grid;gap:8px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;background:#fffafa;color:var(--txt)}
input:focus,select:focus{outline:none;border-color:var(--rose-d)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:12px;padding:12px;font-size:1rem;font-weight:600;background:var(--rose-d);color:#fff;cursor:pointer}
.filters{display:flex;gap:8px;margin:16px 0 10px;overflow-x:auto}
.chip{background:var(--card);color:var(--rose-d);border:1.5px solid var(--line);padding:8px 14px;border-radius:20px;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.item{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(201,135,145,.12)}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--rose);background:#fff;flex:none;padding:0;color:#fff;font-size:1rem}
.item.done .chk{background:var(--rose)}
.body{flex:1;min-width:0}
.t{font-weight:600;word-break:break-word}
.m{font-size:.8rem;color:var(--mut);margin-top:2px}
.m a{color:var(--rose-d)}
.del{background:none;color:var(--mut);padding:6px 10px;font-size:1.2rem}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.total{text-align:right;color:var(--mut);font-size:.9rem;margin:4px 4px 12px}
</style>
</head>
<body>
<header><h1>Ma WishList</h1><div class="sub" id="count"></div></header>
<main>
<div class="add">
<input id="name" placeholder="Que souhaites-tu ?" maxlength="80">
<div class="row">
<input id="price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Prix (€)">
<select id="prio"><option value="1">Envie</option><option value="2">Super envie</option><option value="3">Indispensable</option></select>
</div>
<input id="link" type="url" placeholder="Lien (facultatif)">
<button id="addBtn">Ajouter</button>
</div>
<div class="filters" id="filters"></div>
<div class="total" id="total"></div>
<div id="list"></div>
</main>
<script>
var KEY = 'wishlist-items-v1';
var items = [];
var filter = 'all';
var PRIO = { 1: 'Envie', 2: 'Super envie', 3: 'Indispensable' };

function load() {
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function safeUrl(u) {
  return /^https?:\/\//i.test(u) ? u : '';
}
function addItem() {
  var name = document.getElementById('name').value.trim();
  if (!name) return;
  var price = parseFloat(document.getElementById('price').value);
  items.unshift({
    id: Date.now(),
    name: name,
    price: isNaN(price) ? null : price,
    prio: parseInt(document.getElementById('prio').value, 10),
    link: safeUrl(document.getElementById('link').value.trim()),
    done: false
  });
  document.getElementById('name').value = '';
  document.getElementById('price').value = '';
  document.getElementById('link').value = '';
  save();
  render();
}
function toggle(id) {
  items.forEach(function (i) { if (i.id === id) i.done = !i.done; });
  save(); render();
}
function removeItem(id) {
  items = items.filter(function (i) { return i.id !== id; });
  save(); render();
}
function setFilter(f) { filter = f; render(); }

function render() {
  var filters = [['all', 'Tout'], ['todo', 'À avoir'], ['done', 'Offert']];
  var fh = '';
  filters.forEach(function (f) {
    fh += '<button class="chip' + (filter === f[0] ? ' on' : '') + '" data-f="' + f[0] + '">' + f[1] + '</button>';
  });
  document.getElementById('filters').innerHTML = fh;

  var shown = items.filter(function (i) {
    return filter === 'all' || (filter === 'todo' ? !i.done : i.done);
  }).sort(function (a, b) { return a.done - b.done || b.prio - a.prio; });

  var h = '';
  shown.forEach(function (i) {
    h += '<div class="item' + (i.done ? ' done' : '') + '">';
    h += '<button class="chk" data-t="' + i.id + '">' + (i.done ? '&#10003;' : '') + '</button>';
    h += '<div class="body"><div class="t">' + esc(i.name) + '</div><div class="m">' + PRIO[i.prio];
    if (i.price !== null) h += ' &middot; ' + i.price.toFixed(2).replace('.', ',') + ' &euro;';
    if (i.link) h += ' &middot; <a href="' + esc(i.link) + '" target="_blank" rel="noopener">Lien</a>';
    h += '</div></div>';
    h += '<button class="del" data-d="' + i.id + '" aria-label="Supprimer">&times;</button></div>';
  });
  document.getElementById('list').innerHTML = h || '<div class="empty">Rien ici pour le moment &#127872;</div>';

  var todo = items.filter(function (i) { return !i.done; });
  var sum = todo.reduce(function (s, i) { return s + (i.price || 0); }, 0);
  document.getElementById('count').textContent = todo.length + ' souhait' + (todo.length > 1 ? 's' : '') + ' à réaliser';
  document.getElementById('total').textContent = sum > 0 ? 'Total restant : ' + sum.toFixed(2).replace('.', ',') + ' €' : '';
}

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('name').addEventListener('keydown', function (e) { if (e.key === 'Enter') addItem(); });
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.dataset.f) setFilter(t.dataset.f);
  else if (t.dataset.t) toggle(parseInt(t.dataset.t, 10));
  else if (t.dataset.d) removeItem(parseInt(t.dataset.d, 10));
});

load();
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>

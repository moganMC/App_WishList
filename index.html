<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8b4bc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WishList">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ma WishList</title>
<style>
:root{--bg:#fbeef0;--card:#fff;--rose:#e8b4bc;--rose-d:#c98791;--txt:#4a3438;--mut:#9b7f84;--line:#f3d9dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.hero{margin:-16px -16px 16px;min-height:42vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;padding:calc(env(safe-area-inset-top) + 24px) 24px 24px;border-radius:0 0 32px 32px;background:linear-gradient(160deg,#f1c6cd,#d99aa5);background-size:cover;background-position:center;position:relative}
.hero h1{margin:0;font-size:2rem;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.hero p{margin:8px 0 0;font-size:1rem;text-shadow:0 1px 6px rgba(0,0,0,.25)}
h2{margin:6px 0 2px;font-size:1.3rem}
.sec{font-weight:700;margin:18px 0 8px;color:var(--rose-d)}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(201,135,145,.15);display:grid;gap:8px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;background:#fffafa;color:var(--txt)}
input:focus,select:focus{outline:none;border-color:var(--rose-d)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:12px;padding:12px;font-size:1rem;font-weight:600;background:var(--rose-d);color:#fff;cursor:pointer;font-family:inherit}
button.ghost{background:none;color:var(--mut);font-weight:500;font-size:.9rem}
.photo{display:flex;align-items:center;gap:10px}
.photo label{flex:1;border:1.5px dashed var(--rose);border-radius:12px;padding:11px;text-align:center;color:var(--rose-d);cursor:pointer;font-size:.95rem}
.photo input{display:none}
.photo img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.lcard{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(201,135,145,.12);cursor:pointer}
.lcard b{display:block}
.badge{background:var(--rose);color:#fff;border-radius:14px;padding:4px 10px;font-size:.85rem}
.item{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(201,135,145,.12)}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--rose);background:#fff;flex:none;padding:0;color:#fff;font-size:1rem}
.item.done .chk{background:var(--rose)}
.th{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none}
.body{flex:1;min-width:0}
.t{font-weight:600;word-break:break-word}
.m{font-size:.8rem;color:var(--mut);margin-top:2px}
.m a{color:var(--rose-d)}
.del{background:none;color:var(--mut);padding:6px 10px;font-size:1.2rem}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.opt{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:6px}
.opt span{flex:1;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:6px}
.addrow button{flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px rgba(201,135,145,.15);z-index:5}
nav .tab{background:none;color:var(--mut);border-radius:0;padding:8px 12px;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;min-width:62px}
nav .tab i{font-style:normal;font-size:1.3rem;line-height:1}
nav .tab.on{color:var(--rose-d);background:var(--bg)}
nav .scroll{flex:1;display:flex;overflow-x:auto;min-width:0}
nav .scroll .tab{max-width:110px}
nav .scroll .tab span{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs"></nav>
<script>
var HOME_BG = ''; // URL de l'image de fond de l'accueil (à définir plus tard)
var HOME_TITLE = 'Ma WishList';
var HOME_TEXT = 'Toutes mes envies, bien rangées.';
var KEY = 'wishlist-v2';
var OLD_KEY = 'wishlist-items-v1';
var state = null;
var view = 'home';
var pendingImg = '';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : ''; }
function money(n) { return n.toFixed(2).replace('.', ',') + ' €'; }

function defaults() {
  return {
    lists: [],
    labels: [
      { id: 'l1', name: 'Anniversaire' }, { id: 'l2', name: 'Noël' },
      { id: 'l3', name: 'Naissance' }, { id: 'l4', name: 'Mariage' }, { id: 'l5', name: 'Perso' }
    ],
    prios: [{ id: 'p1', name: 'Envie' }, { id: 'p2', name: 'Super envie' }, { id: 'p3', name: 'Indispensable' }]
  };
}
function load() {
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state) {
    state = defaults();
    try {
      var old = JSON.parse(localStorage.getItem(OLD_KEY));
      if (old && old.length) {
        old.forEach(function (i) { i.prio = 'p' + i.prio; i.img = ''; });
        state.lists.push({ id: uid(), name: 'Ma liste', label: 'l5', items: old });
      }
    } catch (e) {}
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { alert('Stockage plein : supprime des photos ou des souhaits.'); }
}
function findList(id) {
  for (var i = 0; i < state.lists.length; i++) if (state.lists[i].id === id) return state.lists[i];
  return null;
}
function optName(arr, id) {
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i].name;
  return '';
}
function optIndex(arr, id) {
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return i;
  return -1;
}
function options(arr, sel) {
  var h = '';
  arr.forEach(function (o) { h += '<option value="' + o.id + '"' + (o.id === sel ? ' selected' : '') + '>' + esc(o.name) + '</option>'; });
  return h;
}
function todoCount(l) { return l.items.filter(function (i) { return !i.done; }).length; }

function readImg(file, cb) {
  var fr = new FileReader();
  fr.onload = function () {
    var im = new Image();
    im.onload = function () {
      var s = Math.min(1, 480 / Math.max(im.width, im.height));
      var c = document.createElement('canvas');
      c.width = Math.round(im.width * s);
      c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- Vues ---------- */
function viewHome() {
  var style = HOME_BG ? ' style="background-image:url(' + esc(HOME_BG) + ')"' : '';
  var h = '<div class="hero"' + style + '><h1>' + esc(HOME_TITLE) + '</h1><p>' + esc(HOME_TEXT) + '</p></div>';
  if (!state.lists.length) return h + '<div class="empty">Appuie sur « + » pour créer ta première liste.</div>';
  h += '<div class="sec">Mes listes</div>';
  state.lists.forEach(function (l) {
    h += '<div class="lcard" data-v="' + l.id + '"><div><b>' + esc(l.name) + '</b><span class="m">' + esc(optName(state.labels, l.label)) + '</span></div>';
    h += '<span class="badge">' + todoCount(l) + '</span></div>';
  });
  return h;
}
function viewNew() {
  var h = '<h2>Nouvelle liste</h2><div class="card">';
  h += '<input id="lname" placeholder="Nom de la liste" maxlength="40">';
  h += '<select id="llabel">' + options(state.labels, '') + '</select>';
  h += '<button data-cl="1">Créer la liste</button></div>';
  return h;
}
function viewList(l) {
  var sum = 0;
  l.items.forEach(function (i) { if (!i.done && i.price) sum += i.price; });
  var h = '<h2>' + esc(l.name) + '</h2><div class="m">' + esc(optName(state.labels, l.label)) + ' · ' + todoCount(l) + ' à avoir';
  if (sum > 0) h += ' · ' + money(sum);
  h += '</div><div class="sec">Ajouter un souhait</div><div class="card">';
  h += '<input id="name" placeholder="Que souhaites-tu ?" maxlength="80">';
  h += '<div class="row"><input id="price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Prix (€)">';
  h += '<select id="prio">' + options(state.prios, '') + '</select></div>';
  h += '<input id="link" type="url" placeholder="Lien (facultatif)">';
  h += '<div class="photo"><label for="img">&#128247; Ajouter une photo</label><input id="img" type="file" accept="image/*"><img id="prev" alt="" style="display:none"></div>';
  h += '<button data-add="1">Ajouter</button></div>';
  var sorted = l.items.slice().sort(function (a, b) {
    return (a.done ? 1 : 0) - (b.done ? 1 : 0) || optIndex(state.prios, b.prio) - optIndex(state.prios, a.prio);
  });
  h += '<div class="sec">Souhaits</div>';
  sorted.forEach(function (i) {
    h += '<div class="item' + (i.done ? ' done' : '') + '">';
    h += '<button class="chk" data-t="' + i.id + '">' + (i.done ? '&#10003;' : '') + '</button>';
    if (i.img) h += '<img class="th" src="' + i.img + '" alt="">';
    h += '<div class="body"><div class="t">' + esc(i.name) + '</div><div class="m">' + esc(optName(state.prios, i.prio) || '—');
    if (i.price !== null && i.price !== undefined) h += ' · ' + money(i.price);
    if (i.link) h += ' · <a href="' + esc(i.link) + '" target="_blank" rel="noopener">Lien</a>';
    h += '</div></div><button class="del" data-d="' + i.id + '" aria-label="Supprimer">&times;</button></div>';
  });
  if (!sorted.length) h += '<div class="empty">Aucun souhait pour le moment.</div>';
  h += '<button class="ghost" data-dl="' + l.id + '">Supprimer cette liste</button>';
  return h;
}
function optSection(title, key) {
  var h = '<div class="sec">' + title + '</div>';
  state[key].forEach(function (o) {
    h += '<div class="opt"><span data-r="' + key + ':' + o.id + '">' + esc(o.name) + '</span>';
    h += '<button class="del" data-x="' + key + ':' + o.id + '" aria-label="Supprimer">&times;</button></div>';
  });
  h += '<div class="addrow"><input id="add-' + key + '" placeholder="Nouvelle option" maxlength="30"><button data-a="' + key + '">+</button></div>';
  return h;
}
function viewSettings() {
  var h = '<h2>Réglages</h2><div class="m">Touche un nom pour le renommer.</div>';
  h += optSection('Libellés des listes', 'labels');
  h += optSection('Priorités des souhaits', 'prios');
  return h;
}

function renderTabs() {
  var t = '<button class="tab' + (view === 'home' ? ' on' : '') + '" data-v="home"><i>&#127968;</i><span>Accueil</span></button><div class="scroll">';
  state.lists.forEach(function (l) {
    t += '<button class="tab' + (view === l.id ? ' on' : '') + '" data-v="' + l.id + '"><i>&#9825;</i><span>' + esc(l.name) + '</span></button>';
  });
  t += '</div><button class="tab' + (view === 'new' ? ' on' : '') + '" data-v="new"><i>&#65291;</i><span>Créer</span></button>';
  t += '<button class="tab' + (view === 'settings' ? ' on' : '') + '" data-v="settings"><i>&#9881;</i><span>Réglages</span></button>';
  document.getElementById('tabs').innerHTML = t;
}
function render() {
  var l = findList(view);
  if (!l && view !== 'home' && view !== 'new' && view !== 'settings') view = 'home';
  var h = view === 'home' ? viewHome() : view === 'new' ? viewNew() : view === 'settings' ? viewSettings() : viewList(l);
  document.getElementById('app').innerHTML = h;
  renderTabs();
}
function go(v) { view = v; pendingImg = ''; render(); window.scrollTo(0, 0); }

/* ---------- Actions ---------- */
function createList() {
  var name = document.getElementById('lname').value.trim();
  if (!name) return;
  var l = { id: uid(), name: name, label: document.getElementById('llabel').value, items: [] };
  state.lists.push(l);
  save();
  go(l.id);
}
function addItem() {
  var l = findList(view);
  var name = document.getElementById('name').value.trim();
  if (!l || !name) return;
  var price = parseFloat(document.getElementById('price').value);
  l.items.unshift({
    id: uid(), name: name, price: isNaN(price) ? null : price,
    prio: document.getElementById('prio').value,
    link: safeUrl(document.getElementById('link').value.trim()),
    img: pendingImg, done: false
  });
  pendingImg = '';
  save(); render();
}
function toggleItem(id) {
  findList(view).items.forEach(function (i) { if (i.id === id) i.done = !i.done; });
  save(); render();
}
function removeItem(id) {
  var l = findList(view);
  l.items = l.items.filter(function (i) { return i.id !== id; });
  save(); render();
}
function removeList(id) {
  if (!confirm('Supprimer cette liste et tous ses souhaits ?')) return;
  state.lists = state.lists.filter(function (l) { return l.id !== id; });
  save(); go('home');
}
function addOption(key) {
  var inp = document.getElementById('add-' + key);
  var v = inp.value.trim();
  if (!v) return;
  state[key].push({ id: uid(), name: v });
  save(); render();
}
function renameOption(key, id) {
  var cur = optName(state[key], id);
  var v = prompt('Nouveau nom', cur);
  if (v === null || !v.trim()) return;
  state[key].forEach(function (o) { if (o.id === id) o.name = v.trim(); });
  save(); render();
}
function removeOption(key, id) {
  if (state[key].length <= 1) { alert('Garde au moins une option.'); return; }
  state[key] = state[key].filter(function (o) { return o.id !== id; });
  save(); render();
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-v],[data-t],[data-d],[data-dl],[data-add],[data-cl],[data-a],[data-r],[data-x]') : null;
  if (!t) return;
  var d = t.dataset;
  if (d.v) go(d.v);
  else if (d.t) toggleItem(d.t);
  else if (d.d) removeItem(d.d);
  else if (d.dl) removeList(d.dl);
  else if (d.add) addItem();
  else if (d.cl) createList();
  else if (d.a) addOption(d.a);
  else if (d.r) renameOption(d.r.split(':')[0], d.r.split(':')[1]);
  else if (d.x) removeOption(d.x.split(':')[0], d.x.split(':')[1]);
});
document.addEventListener('change', function (e) {
  if (e.target.id !== 'img' || !e.target.files || !e.target.files[0]) return;
  readImg(e.target.files[0], function (data) {
    pendingImg = data;
    var p = document.getElementById('prev');
    if (p) { p.src = data; p.style.display = 'block'; }
  });
});

load();
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
